<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnimeX · Panel Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="../assets/icono.ico">
</head>
<body>

  <!-- ─── LOGIN ─── -->
  <div id="login-screen">
    <div class="login-card">
      <img src="../assets/animex-logo.webp" alt="AnimeX" class="login-logo">
      <h1>Panel Admin</h1>
      <p class="login-subtitle">Acceso exclusivo para administradores</p>
      <form id="login-form">
        <label class="field">
          <span>Email</span>
          <input id="inp-email" type="email" required autocomplete="email" placeholder="admin@email.com">
        </label>
        <label class="field">
          <span>Contraseña</span>
          <input id="inp-password" type="password" required autocomplete="current-password" placeholder="••••••••">
        </label>
        <p id="login-error" class="error-msg" hidden></p>
        <button type="submit" class="btn btn-primary" id="login-btn">Iniciar sesión</button>
      </form>
    </div>
  </div>

  <!-- ─── APP SHELL ─── -->
  <div id="app" hidden>
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="../assets/animex-logo.webp" alt="AnimeX">
        <span>Admin</span>
      </div>

      <nav>
        <a href="#/users" class="nav-link" data-page="users">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          Usuarios
        </a>
        <a href="#/announcements" class="nav-link" data-page="announcements">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 17H2a3 3 0 0 0 3-3V9a7 7 0 0 1 14 0v5a3 3 0 0 0 3 3z"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          Anuncios
        </a>
        <a href="#/support" class="nav-link" data-page="support">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          Soporte
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="admin-chip">
          <div class="avatar" id="admin-avatar">A</div>
          <span id="admin-label">Admin</span>
        </div>
        <button id="logout-btn" class="btn-icon" title="Cerrar sesión">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </aside>

    <main id="page-content" class="main"></main>
  </div>

  <!-- ─── MODAL ─── -->
  <div id="modal" class="modal-overlay" hidden>
    <div class="modal-box" role="dialog" aria-modal="true"></div>
  </div>

  <!-- ─── TOASTS ─── -->
  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
